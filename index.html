<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111311" />
    <title>Technics Player Sim</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Interactive Technics CD receiver"></canvas>
      <div id="loading" role="status">
        <div class="loading-content">
          <span id="loading-label">LOADING SCENE</span>
          <div class="loading-track" aria-hidden="true"><div id="loading-progress"></div></div>
        </div>
      </div>
      <div id="camera-navigation" aria-label="Camera navigation">
        <div id="camera-hotspots"></div>
        <button id="camera-back" type="button" aria-label="Back to overview">BACK</button>
      </div>
      <div id="reticle" aria-hidden="true"></div>
      <div id="status" aria-live="polite"></div>
      <button id="load-track" type="button" disabled>LOAD TRACK</button>
      <input id="track-file" type="file" accept=".flac,.wav,.mp3,audio/flac,audio/wav,audio/mpeg" multiple hidden />
      <button id="debug-toggle" type="button" title="Toggle level editor">DEBUG</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
